<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Timer model tests</title>
<style>
  body { font: 14px/1.4 monospace; margin: 1em; }
  .ok { color: #070; } .fail { color: #b00; font-weight: bold; }
</style>
</head>
<body>
<h3>timer.js tests</h3>
<pre id="out"></pre>
<script src="../timer-panel/html_ui/InGamePanels/TimerPanel/tm/timer.js"></script>
<script>
var out = document.getElementById('out'), failures = 0;
function check(name, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    if (!ok) { failures++; }
    out.innerHTML += '<span class="' + (ok ? 'ok' : 'fail') + '">' + (ok ? 'ok   ' : 'FAIL ') + name +
        ' = ' + JSON.stringify(actual) + (ok ? '' : ' (expected ' + JSON.stringify(expected) + ')') + '</span>\n';
}

// Stopwatch
var t = new TM.Timer();
check('idle shows 0', t.shown(5000), 0);
check('start', t.start(1000), true);
check('running elapsed', t.elapsed(3500), 2500);
check('lap 1', t.lap(3500) && t.laps[0], { total: 2500, split: 2500 });
check('lap 2', t.lap(6000) && t.laps[1], { total: 5000, split: 2500 });
check('stop', t.stop(7000), true);
check('stopped elapsed is frozen', t.elapsed(99999), 6000);
check('no lap when stopped', t.lap(99999), false);
check('resume', t.start(10000), true);
check('resumed elapsed', t.elapsed(11000), 7000);
t.stop(11000); t.reset();
check('reset clears', [t.elapsed(0), t.laps.length, t.isClear()], [0, 0, true]);

// Countdown
t = new TM.Timer();
t.setMode('down');
check('cannot start at 0', t.start(0), false);
t.addTarget(60000); t.addTarget(10000); t.addTarget(-5000000);
check('target clamps at 0', t.target, 0);
t.addTarget(70000);
check('target 70 s', t.target, 70000);
check('start', t.start(1000), true);
check('remaining', t.shown(11000), 60000);
check('cannot edit target while running', t.addTarget(1000), false);
check('tick before the end', t.tick(70999), null);
check('tick at the end', t.tick(71000), 'finished');
check('done state', [t.done, t.isRunning(), t.shown(99999)], [true, false, 0]);
check('tick only reports once', t.tick(72000), null);
check('cannot restart before reset', t.start(80000), false);
t.reset();
check('reset keeps the length', [t.target, t.done, t.start(0)], [70000, false, true]);
t.stop(30000);
check('paused countdown', t.shown(99999), 40000);
check('mode switch resets', (t.setMode('up'), [t.mode, t.acc, t.laps.length]), ['up', 0, 0]);

// Save / restore, including a timer that ran while the panel was closed
t = new TM.Timer(); t.start(1000);
var back = new TM.Timer(JSON.parse(JSON.stringify(t)));
check('restored running timer', back.elapsed(5000), 4000);
t = new TM.Timer(); t.setMode('down'); t.addTarget(5000); t.start(0);
back = new TM.Timer(JSON.parse(JSON.stringify(t)));
check('restored countdown ends on first tick', back.tick(60000), 'finished');
check('garbage state is tolerated', new TM.Timer({ mode: 7, acc: 'x', laps: [1, null] }).toJSON(), { mode: 'up', target: 0, acc: 0, startedAt: null, laps: [], done: false });

// Display fields and text
check('split 1:02:03.45', TM.split(3723450, false), { h: 1, m: 2, s: 3, cs: 45 });
check('split rounds up for countdown', TM.split(1, true), { h: 0, m: 0, s: 0, cs: 1 });
check('split 0 stays 0', TM.split(0, true), { h: 0, m: 0, s: 0, cs: 0 });
check('split wraps at 100 h', TM.split(100 * 3600000, false), { h: 0, m: 0, s: 0, cs: 0 });
check('format short', TM.format(125340), '2:05.34');
check('format long', TM.format(3723450), '1:02:03.45');

out.innerHTML += '\n' + (failures ? '<span class="fail">' + failures + ' FAILED</span>' : '<span class="ok">All passed</span>') + '\n';
document.title = failures ? 'FAIL' : 'PASS';
</script>
</body>
</html>
